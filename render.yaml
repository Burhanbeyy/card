services:
  - type: web
    name: gift-card-checker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SALT
        value: giftcard-admin-hash
      - key: SESSION_SECRET
        sync: false
      - key: DB_TYPE
        value: sqlite
      - key: DB_PATH
        value: ./data/requests.sqlite
