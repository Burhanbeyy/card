<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .card { width: min(92vw, 420px); background: white; color: #111827; padding: 24px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-top: 8px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; background: #111827; color: white; border: 0; padding: 12px; border-radius: 8px; cursor: pointer; }
    .hint { font-size: 14px; color: #475569; margin-top: 8px; }
    .error { color: #b91c1c; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create an account</h2>
    <form id="signup-form">
      <label>Username</label>
      <input id="username" name="username" required />
      <label>Email</label>
      <input id="email" name="email" type="email" required />
      <label>Password</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Sign Up</button>
      <div id="error" class="error"></div>
      <p class="hint">This demo signup form is informational. For the deployed site, account creation is handled by your admin flow.</p>
    </form>
  </div>
  <script>
    document.getElementById('signup-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = 'Signup is currently unavailable for this demo. Please use the admin login page.';
    });
  </script>
</body>
</html>
